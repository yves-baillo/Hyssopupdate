<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HYSSOP · Admin Login</title>
  <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/dtp1VnDR/Gemini-Generated-Image-q4zen2q4zen2q4ze.jpg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #0a0e0c;
      background-image: url('https://images.unsplash.com/photo-1544551763-46a013bb70d5?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
      background-size: cover;
      background-position: center 30%;
      background-attachment: fixed;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(6, 12, 16, 0.60);
      backdrop-filter: blur(2px) saturate(0.8);
      -webkit-backdrop-filter: blur(2px) saturate(0.8);
      z-index: 0;
    }

    .login-wrapper {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      max-width: 1100px;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -1px 0 rgba(255, 255, 255, 0.02);
      overflow: hidden;
      animation: fadeSlide 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Water ripple effect overlay */
    .login-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 80%, rgba(215, 173, 69, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(215, 173, 69, 0.03) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.02) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Water wave animation */
    .login-wrapper::after {
      content: '';
      position: absolute;
      inset: -50%;
      background: radial-gradient(ellipse at 30% 50%, rgba(215, 173, 69, 0.02) 0%, transparent 60%);
      animation: waterGlow 8s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes waterGlow {
      0% {
        transform: translate(-10%, -5%) scale(1);
        opacity: 0.3;
      }
      50% {
        transform: translate(5%, 10%) scale(1.1);
        opacity: 0.6;
      }
      100% {
        transform: translate(10%, -8%) scale(0.95);
        opacity: 0.4;
      }
    }

    /* Water droplet effect on corners */
    .login-wrapper .drop {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.05), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .login-wrapper .drop-1 {
      width: 120px;
      height: 120px;
      top: -40px;
      right: -30px;
      animation: floatDrop 12s ease-in-out infinite;
    }
    .login-wrapper .drop-2 {
      width: 80px;
      height: 80px;
      bottom: -20px;
      left: -20px;
      animation: floatDrop 15s ease-in-out infinite reverse;
    }
    .login-wrapper .drop-3 {
      width: 60px;
      height: 60px;
      top: 40%;
      right: -15px;
      animation: floatDrop 10s ease-in-out infinite 2s;
    }

    @keyframes floatDrop {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      50% { transform: translate(15px, -20px) scale(1.2); opacity: 0.6; }
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(40px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand-side {
      padding: 50px 45px 45px 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      z-index: 1;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .brand-side .logo-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand-side .logo-wrap img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      border: 2px solid rgba(215, 173, 69, 0.20);
      object-fit: cover;
      box-shadow: 0 8px 30px rgba(215, 173, 69, 0.08);
      transition: transform 0.3s ease;
    }

    .brand-side .logo-wrap img:hover {
      transform: scale(1.04) rotate(-1deg);
    }

    .brand-side .logo-wrap h1 {
      font-size: 38px;
      font-weight: 700;
      color: #f2e5c7;
      letter-spacing: 2px;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
    }

    .brand-side .logo-wrap h1 span {
      color: #d7ad45;
    }

    .brand-side .features {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .brand-side .features .item {
      display: flex;
      align-items: center;
      gap: 14px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      font-weight: 400;
    }

    .brand-side .features .item i {
      width: 20px;
      color: #d7ad45;
      font-size: 16px;
    }

    .brand-side .divider-light {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, rgba(215, 173, 69, 0.4), transparent);
      margin: 18px 0 6px 0;
    }

    .form-side {
      padding: 50px 45px 45px 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .form-side .form-header {
      margin-bottom: 28px;
    }

    .form-side .form-header h2 {
      font-size: 26px;
      font-weight: 600;
      color: #f0f4f2;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
    }

    .form-side .form-header h2 i {
      color: #d7ad45;
      font-size: 22px;
    }

    .form-side .form-header p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      margin-top: 6px;
      letter-spacing: 0.2px;
    }

    .toast-error {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: rgba(231, 76, 60, 0.10);
      border: 1px solid rgba(231, 76, 60, 0.15);
      border-radius: 14px;
      color: #f1948a;
      font-size: 13px;
      margin-bottom: 18px;
      backdrop-filter: blur(4px);
    }

    .toast-error.show {
      display: flex;
    }

    .toast-error i {
      font-size: 18px;
      color: #e74c3c;
    }

    .toast-success {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: rgba(46, 204, 113, 0.10);
      border: 1px solid rgba(46, 204, 113, 0.15);
      border-radius: 14px;
      color: #2ecc71;
      font-size: 13px;
      margin-bottom: 18px;
      backdrop-filter: blur(4px);
    }

    .toast-success.show {
      display: flex;
    }

    .toast-success i {
      font-size: 18px;
      color: #2ecc71;
    }

    .field {
      margin-bottom: 22px;
    }

    .field label {
      display: block;
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 7px;
    }

    .field label i {
      color: #d7ad45;
      margin-right: 6px;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      transition: 0.25s ease;
      backdrop-filter: blur(4px);
    }

    .input-wrap:focus-within {
      border-color: #d7ad45;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 0 4px rgba(215, 173, 69, 0.06);
    }

    .input-wrap .icon {
      flex: 0 0 46px;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 16px;
      transition: 0.25s;
    }

    .input-wrap:focus-within .icon {
      color: #d7ad45;
    }

    .input-wrap input {
      flex: 1;
      padding: 15px 16px 15px 0;
      border: none;
      background: transparent;
      color: #f0f4f2;
      font-size: 14px;
      outline: none;
      font-weight: 400;
    }

    .input-wrap input::placeholder {
      color: rgba(255, 255, 255, 0.3);
      font-weight: 300;
    }

    .toggle-btn {
      flex: 0 0 46px;
      text-align: center;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      font-size: 16px;
      cursor: pointer;
      padding: 0;
      transition: 0.2s;
    }

    .toggle-btn:hover {
      color: #d7ad45;
    }

    .btn-login {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #d7ad45;
      color: #0b0e0d;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.8px;
      margin-top: 6px;
    }

    .btn-login:hover {
      background: #eac77a;
      transform: translateY(-2px);
      box-shadow: 0 12px 40px -8px rgba(215, 173, 69, 0.25);
    }

    .btn-login:active {
      transform: scale(0.97);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-login .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(11, 14, 13, 0.20);
      border-top-color: #0b0e0d;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .btn-login.loading .spinner {
      display: inline-block;
    }

    .btn-login.loading .btn-text {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .form-footer {
      margin-top: 18px;
      text-align: center;
    }

    .form-footer a {
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
      transition: 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .form-footer a:hover {
      color: #d7ad45;
    }

    .register-link {
      margin-top: 15px;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
    }

    .register-link a {
      color: #d7ad45;
      text-decoration: none;
      font-weight: 600;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    /* Registration Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: rgba(12, 20, 22, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(215, 173, 69, 0.15);
      border-radius: 32px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      animation: fadeSlide 0.4s ease;
    }

    .modal-box .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-box .modal-header h2 {
      color: #f2e5c7;
      font-size: 24px;
    }

    .modal-box .modal-header h2 i {
      color: #d7ad45;
      margin-right: 10px;
    }

    .modal-box .modal-close {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      font-size: 28px;
      cursor: pointer;
      transition: 0.2s;
    }

    .modal-box .modal-close:hover {
      color: #fff;
      transform: rotate(90deg);
    }

    .modal-box p {
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      margin-top: 15px;
      text-align: center;
    }

    .modal-box p a {
      color: #d7ad45;
      text-decoration: none;
    }

    .modal-box p a:hover {
      text-decoration: underline;
    }

    /* Global Toast */
    .toast-global {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 14px 28px;
      border-radius: 60px;
      color: #0b0e0d;
      font-weight: 500;
      font-size: 14px;
      opacity: 0;
      transform: translateY(16px);
      transition: 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1);
      z-index: 999;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 40px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .toast-global.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-global.success {
      background: #d7ad45;
    }

    .toast-global.error {
      background: #e74c3c;
      color: #fff;
    }

    @media (max-width: 880px) {
      .login-wrapper {
        grid-template-columns: 1fr;
        max-width: 480px;
      }

      .brand-side {
        padding: 36px 30px 30px 30px;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        align-items: center;
        text-align: center;
      }

      .brand-side .logo-wrap {
        flex-direction: column;
        gap: 10px;
      }

      .brand-side .features {
        align-items: center;
      }

      .brand-side .divider-light {
        margin: 14px auto 4px auto;
      }

      .form-side {
        padding: 36px 30px 30px 30px;
      }
    }

    @media (max-width: 480px) {
      .brand-side { padding: 28px 18px; }
      .form-side { padding: 28px 18px; }
      .brand-side .logo-wrap h1 { font-size: 28px; }
      .brand-side .logo-wrap img { width: 58px; height: 58px; }
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <!-- Water droplets -->
    <div class="drop drop-1"></div>
    <div class="drop drop-2"></div>
    <div class="drop drop-3"></div>

    <!-- LEFT: brand -->
    <div class="brand-side">
      <div class="logo-wrap">
        <img src="https://i.postimg.cc/dtp1VnDR/Gemini-Generated-Image-q4zen2q4zen2q4ze.jpg" alt="HYSSOP logo" />
        <h1>HYSSOP <span>·</span></h1>
      </div>

      <div class="divider-light"></div>

      <div class="features">
        <div class="item"><i class="fas fa-newspaper"></i> Content management</div>
        <div class="item"><i class="fas fa-users"></i> Subscriber insights</div>
        <div class="item"><i class="fas fa-bullhorn"></i> Real-time updates</div>
        <div class="item"><i class="fas fa-shield-alt"></i> Secure access</div>
      </div>
    </div>

    <!-- RIGHT: form -->
    <div class="form-side">
      <div class="form-header">
        <h2><i class="fas fa-lock"></i> Admin access</h2>
        <p>Sign in to manage your ministry dashboard</p>
      </div>

      <!-- Error Toast -->
      <div class="toast-error" id="formError">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorMsg">Invalid credentials</span>
      </div>

      <!-- Success Toast -->
      <div class="toast-success" id="formSuccess">
        <i class="fas fa-check-circle"></i>
        <span id="successMsg">Login successful!</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email"><i class="fas fa-envelope"></i> Email</label>
          <div class="input-wrap">
            <span class="icon"><i class="fas fa-envelope"></i></span>
            <input type="email" id="email" placeholder="admin@hyssop.com" required autocomplete="email" />
          </div>
        </div>

        <div class="field">
          <label for="password"><i class="fas fa-lock"></i> Password</label>
          <div class="input-wrap">
            <span class="icon"><i class="fas fa-lock"></i></span>
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="toggle-btn" id="togglePassword" aria-label="Toggle visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Sign In</span>
          <span class="spinner"></span>
        </button>
      </form>

      <div class="register-link">
        Don't have an account? <a href="#" id="showRegister">Create one</a>
      </div>

      <div class="form-footer">
        <a href="/"><i class="fas fa-arrow-left"></i> Back to website</a>
      </div>
    </div>
  </div>

  <!-- Registration Modal -->
  <div class="modal" id="registerModal">
    <div class="modal-box">
      <div class="modal-header">
        <h2><i class="fas fa-user-plus"></i> Create Account</h2>
        <button class="modal-close" id="closeRegisterModal">&times;</button>
      </div>
      <form id="registerForm">
        <div class="field">
          <label>Full Name</label>
          <div class="input-wrap">
            <span class="icon"><i class="fas fa-user"></i></span>
            <input type="text" id="regName" placeholder="Your name" />
          </div>
        </div>
        <div class="field">
          <label>Email *</label>
          <div class="input-wrap">
            <span class="icon"><i class="fas fa-envelope"></i></span>
            <input type="email" id="regEmail" placeholder="you@example.com" required />
          </div>
        </div>
        <div class="field">
          <label>Password *</label>
          <div class="input-wrap">
            <span class="icon"><i class="fas fa-lock"></i></span>
            <input type="password" id="regPassword" placeholder="Min 6 characters" required />
          </div>
        </div>
        <button type="submit" class="btn-login" id="registerBtn">
          <span class="btn-text"><i class="fas fa-user-plus"></i> Create Account</span>
          <span class="spinner"></span>
        </button>
      </form>
      <p>
        Already have an account? <a href="#" id="closeRegisterLink">Sign in</a>
      </p>
    </div>
  </div>

  <!-- Global Toast -->
  <div class="toast-global" id="globalToast"></div>

  <script>
    // ============================================================
    // TOGGLE PASSWORD
    // ============================================================
    document.getElementById('togglePassword').addEventListener('click', function() {
      const pw = document.getElementById('password');
      const icon = this.querySelector('i');
      if (pw.type === 'password') {
        pw.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        pw.type = 'password';
        icon.className = 'fas fa-eye';
      }
    });

    // ============================================================
    // GLOBAL TOAST
    // ============================================================
    function showToast(message, type = 'success') {
      const toast = document.getElementById('globalToast');
      toast.textContent = message;
      toast.style.background = type === 'success' ? '#d7ad45' : '#e74c3c';
      toast.style.color = type === 'success' ? '#0b0e0d' : '#fff';
      toast.className = 'toast-global show';
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.className = 'toast-global';
      }, 3500);
    }

    // ============================================================
    // LOGIN HANDLER
    // ============================================================
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('formError');
    const errorMsg = document.getElementById('errorMsg');
    const successBox = document.getElementById('formSuccess');
    const successMsg = document.getElementById('successMsg');
    const loginBtn = document.getElementById('loginBtn');

    function hideAllMessages() {
      errorBox.classList.remove('show');
      successBox.classList.remove('show');
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      hideAllMessages();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email) {
        errorMsg.textContent = 'Please enter your email address';
        errorBox.classList.add('show');
        document.getElementById('email').focus();
        return;
      }
      if (!password) {
        errorMsg.textContent = 'Please enter your password';
        errorBox.classList.add('show');
        document.getElementById('password').focus();
        return;
      }

      loginBtn.classList.add('loading');
      loginBtn.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem('hyssop_token', data.token);
          localStorage.setItem('hyssop_user', JSON.stringify(data.user));

          successMsg.textContent = 'Login successful! Redirecting...';
          successBox.classList.add('show');
          showToast('Welcome back, ' + data.user.name + '!', 'success');

          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 800);
        } else {
          errorMsg.textContent = data.error || 'Invalid email or password';
          errorBox.classList.add('show');
          showToast('Login failed. Please try again.', 'error');
          loginBtn.classList.remove('loading');
          loginBtn.disabled = false;
        }
      } catch (err) {
        console.error('Login error:', err);
        errorMsg.textContent = 'Server error. Please try again later.';
        errorBox.classList.add('show');
        showToast('Connection error', 'error');
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
      }
    });

    // Enter key support
    document.getElementById('email').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
    });
    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
    });

    // ============================================================
    // REGISTRATION
    // ============================================================
    const registerModal = document.getElementById('registerModal');

    document.getElementById('showRegister').addEventListener('click', function(e) {
      e.preventDefault();
      registerModal.classList.add('show');
    });

    document.getElementById('closeRegisterModal').addEventListener('click', function() {
      registerModal.classList.remove('show');
    });

    document.getElementById('closeRegisterLink').addEventListener('click', function(e) {
      e.preventDefault();
      registerModal.classList.remove('show');
    });

    registerModal.addEventListener('click', function(e) {
      if (e.target === this) {
        registerModal.classList.remove('show');
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();

      if (!email) {
        showToast('Email is required', 'error');
        return;
      }
      if (!password || password.length < 6) {
        showToast('Password must be at least 6 characters', 'error');
        return;
      }

      const btn = document.getElementById('registerBtn');
      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, name })
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem('hyssop_token', data.token);
          localStorage.setItem('hyssop_user', JSON.stringify(data.user));
          showToast('Account created! Welcome ' + data.user.name, 'success');
          registerModal.classList.remove('show');
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 800);
        } else {
          showToast(data.error || 'Registration failed', 'error');
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      } catch (err) {
        console.error('Registration error:', err);
        showToast('Server error. Please try again.', 'error');
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });

    // ============================================================
    // CHECK SESSION
    // ============================================================
    (function checkSession() {
      const token = localStorage.getItem('hyssop_token');
      if (token) {
        fetch('/api/verify', {
          headers: { 'Authorization': 'Bearer ' + token }
        })
          .then(res => {
            if (res.ok) {
              window.location.href = '/dashboard';
            } else {
              localStorage.removeItem('hyssop_token');
              localStorage.removeItem('hyssop_user');
            }
          })
          .catch(() => {});
      }
    })();

    console.log('🔐 HYSSOP Login · Real authentication with JWT');
  </script>
</body>
</html>
